type: solution-planner
version: 1
description:
  en: Real-time collaborative solution planner between User, AI Manager, and AI Architect.
  es: Planificador colaborativo de soluciones en tiempo real entre Usuario, Gestor IA y Arquitecto IA.

schema:
  name: SolutionPlannerGraph
  version: 1
  config:
    schemaId: solution-planner
    idStrategy: uuid
    display:
      title:
        en: Solution Planner
        es: Planificador de Soluciones
    changeTracking:
      enabled: true
      mode: history
  nodes:
    SolutionState:
      # One per workspace: this is the state the board *has*, not one of the
      # things it contains. Every write lands on the same node, whoever makes
      # it, so the agents can update the status without carrying an id around.
      singleton: true
      description:
        en: High-level solution planning state and consensus tracking
        es: Estado de planificación de la solución y seguimiento de consenso
      properties:
        appName:
          type: string
          required: true
        description:
          type: text
        language:
          type: enum
          values: [en, es]
          default: en
        status:
          type: enum
          values: [idle, planning, waiting_user_validation, approved]
          default: idle
        managerAgrees:
          type: boolean
          default: false
        architectAgrees:
          type: boolean
          default: false
        iteration:
          type: number
          default: 0
        pendingAssumptionId:
          type: string
        # Which agent is mid-run right now. Agents write their results when a
        # step ends, so without this the board cannot tell "nothing happening"
        # apart from "an agent has been thinking for a minute".
        activeAgent:
          type: enum
          values: [none, manager, architect]
          default: none
        mode:
          type: enum
          values: [initial, revise]
          default: initial
      ui:
        label: "{appName}"
        color: "#6366f1"

    Epic:
      description:
        en: High-level business initiative or milestone. Owns its Features through HAS_FEATURE edges.
        es: Iniciativa de negocio de alto nivel o hito. Posee sus Features mediante aristas HAS_FEATURE.
      guidelines:
        en:
          - An Epic owns a Feature only through a HAS_FEATURE edge. There is no title/parent property that stands in for it.
        es:
          - Una Épica posee un Feature solo a través de una arista HAS_FEATURE. No hay ninguna propiedad de título/padre que la sustituya.
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
        priority:
          type: enum
          values: [low, medium, high]
          default: medium
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#3b82f6"

    Feature:
      description:
        en: Concrete functional capability. Reached from its Epic by HAS_FEATURE, and owns its Tasks by HAS_TASK.
        es: Capacidad funcional concreta. Se alcanza desde su Épica por HAS_FEATURE y posee sus Tasks por HAS_TASK.
      guidelines:
        en:
          - A Feature belongs to exactly one Epic, and that link is the HAS_FEATURE edge — never an epicTitle string.
          - Every Feature you create must be linked to its Epic in the same write.
        es:
          - Un Feature pertenece exactamente a una Épica, y ese vínculo es la arista HAS_FEATURE — nunca una cadena epicTitle.
          - Todo Feature que crees debe enlazarse a su Épica en la misma escritura.
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#06b6d4"

    C4DiagramElement:
      description:
        en: One C4 element. The `type` property is Person, System, Boundary, Container, or Component. `external` renders as Mermaid _Ext.
        es: Un elemento C4. La propiedad `type` es Person, System, Boundary, Container o Component. `external` se dibuja como Mermaid _Ext.
      guidelines:
        en:
          - A container diagram alone is not a C4 model. Model every level that applies - at least one Person for who uses the solution, one Boundary for the system being designed, a System with external:true per third-party system it talks to, and Components inside the Container that carries the most logic.
          - Boundary groups; System is software. Never model the solution itself as both.
          - Nesting is the CONTAINS edge (Boundary CONTAINS Container, Container CONTAINS Component), and a call between elements is the USES edge. Never write a parent's title into a property.
        es:
          - Un diagrama de contenedores por si solo no es un modelo C4. Modela todos los niveles que apliquen - al menos un Person que usa la solucion, un Boundary para el sistema que se disena, un System con external:true por cada sistema de terceros con el que habla, y Components dentro del Container que concentra mas logica.
          - Boundary agrupa; System es software. Nunca modeles la propia solucion como ambos.
          - El anidamiento es la arista CONTAINS (Boundary CONTAINS Container, Container CONTAINS Component), y una llamada entre elementos es la arista USES. Nunca escribas el titulo del padre en una propiedad.
      identity:
        from: [type, title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        type:
          type: enum
          values: [Person, System, Boundary, Container, Component]
          required: true
          description:
            en: C4 element kind. Boundary is grouping only; System is software. Never mix them.
            es: Clase de elemento C4. Boundary solo agrupa; System es software. No los mezcles.
        description:
          type: text
        technology:
          type: string
        external:
          type: boolean
          default: false
          description:
            en: When true, Mermaid uses Person_Ext / System_Ext / Container_Ext / ContainerDb_Ext
            es: Si es true, Mermaid usa Person_Ext / System_Ext / Container_Ext / ContainerDb_Ext
        dirty:
          type: boolean
          default: false
      ui:
        label: "{title}"
        color: "#8b5cf6"

    Task:
      description:
        en: Actionable implementation task with a What/How description and functional/technical story points. Reached from its Feature by HAS_TASK.
        es: Tarea ejecutable de implementación con descripción Qué/Cómo y puntos funcionales/técnicos. Se alcanza desde su Feature por HAS_TASK.
      guidelines:
        en:
          - functionalPoints and technicalPoints are integers from 1 to 21 — never a sentence. Estimate on the Fibonacci ladder (1, 2, 3, 5, 8, 13, 21) by convention.
          - Put What (functional outcome) and How (technical approach) in description, using the labels "What:" and "How:".
          - A Task implements exactly one Feature, and that link is the HAS_TASK edge — never a featureTitle string. Link every Task you create.
          - Point a Task at the C4 element it changes with TARGETS_C4 when one applies.
        es:
          - functionalPoints y technicalPoints son enteros de 1 a 21 — nunca una frase. Estima con la escala Fibonacci (1, 2, 3, 5, 8, 13, 21) por convención.
          - Pon el Qué (resultado funcional) y el Cómo (enfoque técnico) en description, con las etiquetas "Qué:" y "Cómo:".
          - Una Task implementa exactamente un Feature, y ese vínculo es la arista HAS_TASK — nunca una cadena featureTitle. Enlaza toda Task que crees.
          - Apunta la Task al elemento C4 que modifica con TARGETS_C4 cuando aplique.
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
          description:
            en: Must include What (functional outcome / user journey) and How (technical approach, infrastructure, integrations)
            es: Debe incluir Qué (resultado funcional / flujo de usuario) y Cómo (enfoque técnico, infraestructura, integraciones)
        functionalPoints:
          type: number
          integer: true
          default: 1
          min: 1
          max: 21
          description:
            en: Functional-effort story points, integer 1-21. Fibonacci by convention. Never a sentence.
            es: Puntos de esfuerzo funcional, entero de 1 a 21. Fibonacci por convención. Nunca una frase.
        technicalPoints:
          type: number
          integer: true
          default: 1
          min: 1
          max: 21
          description:
            en: Technical-effort story points, integer 1-21. Fibonacci by convention. Never a sentence.
            es: Puntos de esfuerzo técnico, entero de 1 a 21. Fibonacci por convención. Nunca una frase.
        complexity:
          type: number
          default: 1
          description:
            en: 0 (Trivial) to 5 (Massive architectural overhaul)
            es: 0 (Trivial) a 5 (Reforma arquitectónica masiva)
        uncertainty:
          type: number
          default: 1
          description:
            en: 0 (Done 100x) to 5 (Pure R&D)
            es: 0 (Hecho 100 veces) a 5 (I+D puro)
        friction:
          type: number
          default: 1
          description:
            en: 0 (Solo work) to 5 (Heavy cross-team coordination)
            es: 0 (Trabajo individual) a 5 (Fuerte coordinación entre equipos)
        nfrScale:
          type: number
          default: 0
          description:
            en: 0 (Low/Internal) to 3 (Extreme compliance/scale)
            es: 0 (Bajo/Interno) a 3 (Extrema escala/cumplimiento)
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#10b981"

    Risk:
      description:
        en: Identified business or technical risk with mitigation strategy
        es: Riesgo técnico o de negocio identificado con estrategia de mitigación
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
        description:
          type: text
        severity:
          type: enum
          values: [low, medium, high, critical]
          default: medium
        category:
          type: enum
          values: [business, technical]
          default: business
        mitigation:
          type: text
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#ef4444"

    Assumption:
      description:
        en: Critical assumption requiring human-in-the-loop validation
        es: Suposición crítica que requiere validación humana
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
        description:
          type: text
        status:
          type: enum
          values: [pending, approved, rejected]
          default: pending
        raisedBy:
          type: enum
          values: [manager, architect, human]
          default: manager
        userComment:
          type: text
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#f59e0b"

  # The plan's structure lives here, and only here. Epic → Feature → Task is a
  # path of edges, never a title copied into a property: a rename would silently
  # orphan the child, and nothing could be walked, cascaded, or viewed.
  edges:
    HAS_FEATURE:
      description:
        en: The Epic this Feature belongs to. The only way a Feature is attached to an Epic.
        es: La Épica a la que pertenece este Feature. La única forma de adjuntar un Feature a una Épica.
      from: [Epic]
      to: [Feature]
      directed: true
      guidelines:
        en:
          - Create this edge in the same write as the Feature. An unlinked Feature is not in the plan.
          - One Epic per Feature. To move a Feature, delete the old edge and create the new one.
        es:
          - Crea esta arista en la misma escritura que el Feature. Un Feature sin enlazar no está en el plan.
          - Una Épica por Feature. Para mover un Feature, borra la arista anterior y crea la nueva.
    HAS_TASK:
      description:
        en: The Feature this Task implements. The only way a Task is attached to the plan.
        es: El Feature que implementa esta Task. La única forma de adjuntar una Task al plan.
      from: [Feature]
      to: [Task]
      directed: true
      guidelines:
        en:
          - Create this edge in the same write as the Task. An unlinked Task is not estimated against any Feature.
          - One Feature per Task. To move a Task, delete the old edge and create the new one.
        es:
          - Crea esta arista en la misma escritura que la Task. Una Task sin enlazar no estima ningún Feature.
          - Un Feature por Task. Para mover una Task, borra la arista anterior y crea la nueva.
    HAS_RISK:
      description:
        en: What this Risk threatens — the Epic, Feature, Task, or C4 element it applies to.
        es: Lo que amenaza este Riesgo — la Épica, Feature, Task o elemento C4 al que aplica.
      from: [Epic, Feature, Task, C4DiagramElement]
      to: [Risk]
      directed: true
      guidelines:
        en:
          - Link every Risk to what it threatens. A floating Risk cannot be triaged.
        es:
          - Enlaza cada Riesgo con lo que amenaza. Un Riesgo suelto no se puede triar.
    HAS_ASSUMPTION:
      description:
        en: What this Assumption is load-bearing for — the Epic, Feature, or Task that depends on it.
        es: Aquello que depende de esta Suposición — la Épica, Feature o Task afectada.
      from: [Epic, Feature, Task]
      to: [Assumption]
      directed: true
    CONTAINS:
      description:
        en: C4 nesting - a Boundary contains its Containers, a Container contains its Components.
        es: Anidamiento C4 - un Boundary contiene sus Containers, un Container contiene sus Components.
      from: [C4DiagramElement]
      to: [C4DiagramElement]
      directed: true
    USES:
      description:
        en: A C4 element calls or depends on another (a Mermaid Rel line).
        es: Un elemento C4 llama o depende de otro (una línea Rel de Mermaid).
      from: [C4DiagramElement]
      to: [C4DiagramElement]
      directed: true
    TARGETS_C4:
      description:
        en: The C4 element a Task builds or changes.
        es: El elemento C4 que una Task construye o modifica.
      from: [Task]
      to: [C4DiagramElement]
      directed: true

# Named graph slices. Declared once here, then reached three ways: as
# `view_<name>` MCP tools the agents call, as a catalogue in their system
# prompts, and by the UI through the join payload.
views:
  review_plan:
    title:
      en: Review plan
      es: Revisar plan
    description:
      en: Epics with their features, tasks and the estimations on those tasks.
      es: Épicas con sus features, tareas y las estimaciones de esas tareas.
    guidance:
      en:
        - Every Feature should have at least one Task.
        - functionalPoints and technicalPoints must be Fibonacci integers (1, 2, 3, 5, 8, 13, 21).
      es:
        - Cada Feature debería tener al menos una Task.
        - functionalPoints y technicalPoints deben ser enteros Fibonacci (1, 2, 3, 5, 8, 13, 21).
    params:
      epic:
        type: string
        description:
          en: Epic title or id to scope the review to. Omit to review the whole plan.
          es: Título o id del Epic a revisar. Omítelo para revisar todo el plan.
    select:
      roots:
        types: [Epic]
        where: "params.epic == null || title == params.epic || id == params.epic"
      traverse:
        edges: [HAS_FEATURE, HAS_TASK]
        direction: out
        depth: 2
    fields:
      Epic: [title, description, priority, dirty]
      Feature: [title, description, dirty]
      Task:
        [
          title,
          description,
          functionalPoints,
          technicalPoints,
          complexity,
          uncertainty,
          friction,
          nfrScale,
          dirty,
        ]
    maxNodes: 200

  business_scope:
    title:
      en: Business scope
      es: Alcance de negocio
    description:
      en: The business scope the architecture must serve — epics, features, assumptions and risks.
      es: El alcance de negocio que la arquitectura debe cubrir — épicas, features, suposiciones y riesgos.
    select:
      roots:
        types: [Epic, Feature, Assumption, Risk]
    fields:
      Epic: [title, description, priority]
      Feature: [title, description]
      Assumption: [title, description, status, raisedBy, userComment]
      Risk: [title, description, severity, category, mitigation]

  full_plan:
    title:
      en: Full plan
      es: Plan completo
    description:
      en: Everything currently in the plan, across business and architecture.
      es: Todo lo que hay ahora en el plan, negocio y arquitectura.
    select:
      roots:
        types: [Epic, Feature, Task, C4DiagramElement, Assumption, Risk]
    maxNodes: 300

  dirty_review:
    title:
      en: Pending revision
      es: Revisión pendiente
    description:
      en: Nodes the human changed that the crew has not revised yet, plus one hop of context.
      es: Nodos que el usuario cambió y el equipo aún no ha revisado, más un salto de contexto.
    guidance:
      en:
        - Adapt only these nodes and their relationships. Do not regenerate the plan.
      es:
        - Adapta solo estos nodos y sus relaciones. No regeneres el plan.
    select:
      roots:
        types: [Epic, Feature, Task, C4DiagramElement, Assumption, Risk]
        where: "dirty == true"
      traverse:
        direction: both
        depth: 1

  architecture:
    title:
      en: Architecture
      es: Arquitectura
    description:
      en: The C4 elements and how they contain and use each other.
      es: Los elementos C4 y cómo se contienen y se usan entre sí.
    select:
      roots:
        types: [C4DiagramElement]
    fields:
      C4DiagramElement: [title, type, description, technology, external]

  revision_writeback:
    title:
      en: Revision write-back
      es: Escritura de revisión
    description:
      en: The properties a revision is allowed to write, per node type.
      es: Las propiedades que una revisión puede escribir, por tipo de nodo.
    fields:
      Epic: [title, description, priority]
      Feature: [title, description]
      C4DiagramElement: [title, type, description, technology, external]
      Task:
        [
          title,
          description,
          functionalPoints,
          technicalPoints,
          complexity,
          uncertainty,
          friction,
          nfrScale,
        ]
      Risk: [title, description, severity, category, mitigation]
      Assumption: [title, description, raisedBy, userComment]

params:
  appName:
    type: string
    default: "Solution Planner Demo"
  language:
    type: string
    default: "en"

template:
  nodes:
    - type: SolutionState
      as: state
      properties:
        appName: "{appName}"
        description: "Initial solution workspace"
        language: "{language}"
        status: idle
        managerAgrees: false
        architectAgrees: false
        iteration: 0
        mode: initial

lifecycle:
  idleTimeout: 30m
  maxDuration: 24h

projection: memory
retention:
  onEnd: keep
  artifact: required

tools:
  expose:
    - *  # every generated graph / upsert tool

  agents:
    - role: manager
      actorId: ai-manager
      internalPlanning: false
      description:
        en: AI Product Manager responsible for business requirements, epics, features, and business risks.
        es: Gestor de Producto IA responsable de requerimientos de negocio, épicas, features y riesgos.
      systemPrompt:
        en: |
          You are an AI Product Manager collaborating on this graph in real time.
          Inspect the graph with graph_list / graph_search / graph_get before you answer.
          Then return a plan; the runtime writes it to the graph as one atomic revision.
          - 2-3 high-level Epics, each broken down into 2 concrete Features.
          - Structure is edges, never strings: a Feature hangs off its Epic by HAS_FEATURE.
            Do not restate a parent's title inside a child's properties — no epicTitle, no featureTitle.
          - 1-2 business risks, each attached by HAS_RISK to the Epic or Feature it threatens.
          - On the initial plan, ONE critical assumption for human validation, attached by
            HAS_ASSUMPTION to the Epic it is load-bearing for.
          - State plainly whether you agree with the current business scope.
        es: |
          Eres un Gerente de Producto IA colaborando en este grafo en tiempo real.
          Inspecciona el grafo con graph_list / graph_search / graph_get antes de responder.
          Luego devuelve un plan; el runtime lo escribe en el grafo como una única revisión atómica.
          - 2-3 Épicas, cada una desglosada en 2 Features concretos.
          - La estructura son aristas, nunca cadenas: un Feature cuelga de su Épica por HAS_FEATURE.
            No repitas el título del padre dentro del hijo — ni epicTitle, ni featureTitle.
          - 1-2 riesgos de negocio, cada uno unido por HAS_RISK a la Épica o Feature que amenaza.
          - En el plan inicial, UNA suposición crítica para validación humana, unida por
            HAS_ASSUMPTION a la Épica de la que depende.
          - Indica claramente si estás de acuerdo con el alcance de negocio actual.
      views: [full_plan, review_plan, dirty_review]
      nodes:
        readOnly: [C4DiagramElement, Task]

    - role: architect
      actorId: ai-architect
      internalPlanning: false
      description:
        en: AI Software Architect responsible for C4 architecture diagrams, scored tasks, and technical risks.
        es: Arquitecto de Software IA responsable de diagramas C4, tareas con puntos y riesgos técnicos.
      systemPrompt:
        en: |
          You are an AI Software Architect collaborating on this graph in real time.
          Inspect epics and features with graph_list / graph_search, and consult the
          Microsoft Learn MCP tools when Azure/Microsoft services or libraries are involved.
          Then return a plan; the runtime writes it to the graph as one atomic revision.
          - C4: one C4DiagramElement per element, with type Person, System, Boundary, Container, or Component. Boundary is grouping only (System_Boundary), never a software system. System is software. external:true renders as Person_Ext / System_Ext / Container_Ext. Never pack several containers into one element.
          - Cover every C4 level that applies, not only containers: at least one Person, one Boundary for the system being designed, a System with external:true per third-party system it talks to, and Components inside the Container that carries the most logic.
          - C4 nesting is the CONTAINS edge: Boundary CONTAINS its Containers, Container CONTAINS its Components. Draw call dependencies with USES.
          - Technical tasks for the features. description MUST include What (functional outcome) and How (technical approach). functionalPoints and technicalPoints are integers from 1 to 21 (Fibonacci by convention), plus complexity, uncertainty, friction, nfrScale. Tasks have no status.
          - Every Task hangs off the Feature it implements by a HAS_TASK edge, and points at the C4 element it changes by TARGETS_C4. Structure is edges, never strings — never write a featureTitle property.
          - Technical risks, each attached by HAS_RISK to what it threatens.
          - State plainly whether you agree with the resulting architecture and estimates.
        es: |
          Eres un Arquitecto de Software IA colaborando en este grafo en tiempo real.
          Inspecciona epics y features con graph_list / graph_search, y consulta las
          herramientas de Microsoft Learn cuando apliquen servicios o bibliotecas Azure/Microsoft.
          Luego devuelve un plan; el runtime lo escribe en el grafo como una única revisión atómica.
          - C4: un C4DiagramElement por elemento, con type Person, System, Boundary, Container o Component. Boundary solo agrupa (System_Boundary), nunca es un sistema de software. System es software. external:true se dibuja Person_Ext / System_Ext / Container_Ext. Nunca metas varios contenedores en un solo elemento.
          - Cubre todos los niveles C4 que apliquen, no solo contenedores: al menos un Person, un Boundary para el sistema que se disena, un System con external:true por cada sistema de terceros con el que habla, y Components dentro del Container que concentra mas logica.
          - El anidamiento C4 es la arista CONTAINS: un Boundary CONTAINS sus Containers, un Container CONTAINS sus Components. Dibuja las dependencias de llamada con USES.
          - Tareas técnicas para las features. La descripción DEBE incluir Qué (resultado funcional) y Cómo (enfoque técnico). functionalPoints y technicalPoints son enteros de 1 a 21 (Fibonacci por convención), más complexity, uncertainty, friction, nfrScale. Las tareas no tienen status.
          - Toda Task cuelga por HAS_TASK del Feature que implementa, y apunta por TARGETS_C4 al elemento C4 que modifica. La estructura son aristas, nunca cadenas — nunca escribas una propiedad featureTitle.
          - Riesgos técnicos, cada uno unido por HAS_RISK a lo que amenaza.
          - Indica claramente si estás de acuerdo con la arquitectura y las estimaciones resultantes.
      views: [business_scope, full_plan, review_plan, architecture, dirty_review]
      nodes:
        readOnly: [Epic]
