type: solution-planner
version: 1
description:
  en: Real-time collaborative solution planner between User, AI Manager, and AI Architect.
  es: Planificador colaborativo de soluciones en tiempo real entre Usuario, Gestor IA y Arquitecto IA.

schema:
  name: SolutionPlannerGraph
  version: 1
  config:
    schemaId: solution-planner
    idStrategy: uuid
    display:
      title:
        en: Solution Planner
        es: Planificador de Soluciones
    changeTracking:
      enabled: true
      mode: history
  nodes:
    SolutionState:
      # One per workspace: this is the state the board *has*, not one of the
      # things it contains. Every write lands on the same node, whoever makes
      # it, so the agents can update the status without carrying an id around.
      singleton: true
      description:
        en: High-level solution planning state and consensus tracking
        es: Estado de planificación de la solución y seguimiento de consenso
      properties:
        appName:
          type: string
          required: true
        description:
          type: text
        language:
          type: enum
          values: [en, es]
          default: en
        status:
          type: enum
          values: [idle, planning, waiting_user_validation, approved]
          default: idle
        managerAgrees:
          type: boolean
          default: false
        architectAgrees:
          type: boolean
          default: false
        iteration:
          type: number
          default: 0
        pendingAssumptionId:
          type: string
        mode:
          type: enum
          values: [initial, revise]
          default: initial
      ui:
        label: "{appName}"
        color: "#6366f1"

    Epic:
      description:
        en: High-level business initiative or milestone
        es: Iniciativa de negocio de alto nivel o hito
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
        priority:
          type: enum
          values: [low, medium, high]
          default: medium
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#3b82f6"

    Feature:
      description:
        en: Concrete functional capability belonging to an Epic
        es: Capacidad funcional concreta que pertenece a un Epic
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
        epicTitle:
          type: string
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#06b6d4"

    C4DiagramElement:
      description:
        en: One C4 element. The `type` property is Person, System, Boundary, Container, or Component. `external` renders as Mermaid _Ext.
        es: Un elemento C4. La propiedad `type` es Person, System, Boundary, Container o Component. `external` se dibuja como Mermaid _Ext.
      identity:
        from: [type, title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        type:
          type: enum
          values: [Person, System, Boundary, Container, Component]
          required: true
          description:
            en: C4 element kind. Boundary is grouping only; System is software. Never mix them.
            es: Clase de elemento C4. Boundary solo agrupa; System es software. No los mezcles.
        description:
          type: text
        technology:
          type: string
        external:
          type: boolean
          default: false
          description:
            en: When true, Mermaid uses Person_Ext / System_Ext / Container_Ext / ContainerDb_Ext
            es: Si es true, Mermaid usa Person_Ext / System_Ext / Container_Ext / ContainerDb_Ext
        dirty:
          type: boolean
          default: false
      ui:
        label: "{title}"
        color: "#8b5cf6"

    Task:
      description:
        en: Actionable implementation task with What/How description and Fibonacci functional/technical points
        es: Tarea ejecutable de implementación con descripción Qué/Cómo y puntos Fibonacci funcionales/técnicos
      guidelines:
        en:
          - functionalPoints and technicalPoints MUST be a Fibonacci integer (1, 2, 3, 5, 8, 13, or 21). Never write a sentence there.
          - Put What (functional outcome) and How (technical approach) in description, using the labels "What:" and "How:".
        es:
          - functionalPoints y technicalPoints DEBEN ser un entero Fibonacci (1, 2, 3, 5, 8, 13 o 21). Nunca escribas una frase ahí.
          - Pon el Qué (resultado funcional) y el Cómo (enfoque técnico) en description, con las etiquetas "Qué:" y "Cómo:".
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
          search:
            boost: 6
        description:
          type: text
          description:
            en: Must include What (functional outcome / user journey) and How (technical approach, infrastructure, integrations)
            es: Debe incluir Qué (resultado funcional / flujo de usuario) y Cómo (enfoque técnico, infraestructura, integraciones)
        featureTitle:
          type: string
        functionalPoints:
          type: number
          integer: true
          default: 1
          min: 1
          max: 21
          description:
            en: INTEGER Fibonacci story points only (1, 2, 3, 5, 8, 13, or 21). Never a sentence. 
            es: SOLO un entero Fibonacci (1, 2, 3, 5, 8, 13 o 21). Nunca una frase.
        technicalPoints:
          type: number
          integer: true
          default: 1
          min: 1
          max: 21
          description:
            en: INTEGER Fibonacci story points only (1, 2, 3, 5, 8, 13, or 21). Never a sentence.
            es: SOLO un entero Fibonacci (1, 2, 3, 5, 8, 13 o 21). Nunca una frase. 
        complexity:
          type: number
          default: 1
          description:
            en: 0 (Trivial) to 5 (Massive architectural overhaul)
            es: 0 (Trivial) a 5 (Reforma arquitectónica masiva)
        uncertainty:
          type: number
          default: 1
          description:
            en: 0 (Done 100x) to 5 (Pure R&D)
            es: 0 (Hecho 100 veces) a 5 (I+D puro)
        friction:
          type: number
          default: 1
          description:
            en: 0 (Solo work) to 5 (Heavy cross-team coordination)
            es: 0 (Trabajo individual) a 5 (Fuerte coordinación entre equipos)
        nfrScale:
          type: number
          default: 0
          description:
            en: 0 (Low/Internal) to 3 (Extreme compliance/scale)
            es: 0 (Bajo/Interno) a 3 (Extrema escala/cumplimiento)
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#10b981"

    Risk:
      description:
        en: Identified business or technical risk with mitigation strategy
        es: Riesgo técnico o de negocio identificado con estrategia de mitigación
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
        description:
          type: text
        severity:
          type: enum
          values: [low, medium, high, critical]
          default: medium
        category:
          type: enum
          values: [business, technical]
          default: business
        mitigation:
          type: text
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#ef4444"

    Assumption:
      description:
        en: Critical assumption requiring human-in-the-loop validation
        es: Suposición crítica que requiere validación humana
      identity:
        from: [title]
      properties:
        title:
          type: string
          required: true
        description:
          type: text
        status:
          type: enum
          values: [pending, approved, rejected]
          default: pending
        raisedBy:
          type: enum
          values: [manager, architect]
          default: manager
        userComment:
          type: text
        dirty:
          type: boolean
          default: false
          description:
            en: Human-changed, not yet revised by the Manager/Architect crew
            es: Cambiado por el usuario, aún no revisado por el equipo Gestor/Arquitecto
      ui:
        label: "{title}"
        color: "#f59e0b"

  edges:
    HAS_FEATURE:
      from: [Epic]
      to: [Feature]
      directed: true
    HAS_TASK:
      from: [Feature]
      to: [Task]
      directed: true
    HAS_RISK:
      from: [Epic, Feature, Task]
      to: [Risk]
      directed: true
    HAS_ASSUMPTION:
      from: [Epic, Feature, Task]
      to: [Assumption]
      directed: true
    CONTAINS:
      from: [C4DiagramElement]
      to: [C4DiagramElement]
      directed: true
    USES:
      from: [C4DiagramElement]
      to: [C4DiagramElement]
      directed: true
    TARGETS_C4:
      from: [Task]
      to: [C4DiagramElement]
      directed: true

params:
  appName:
    type: string
    default: "Solution Planner Demo"
  language:
    type: string
    default: "en"

template:
  nodes:
    - type: SolutionState
      as: state
      properties:
        appName: "{appName}"
        description: "Initial solution workspace"
        language: "{language}"
        status: idle
        managerAgrees: false
        architectAgrees: false
        iteration: 0
        mode: initial

lifecycle:
  idleTimeout: 30m
  maxDuration: 24h

projection: memory
retention:
  onEnd: keep
  artifact: required

tools:
  expose:
    - *  # every generated graph / upsert tool

  agents:
    - role: manager
      actorId: ai-manager
      internalPlanning: false
      description:
        en: AI Product Manager responsible for business requirements, epics, features, and business risks.
        es: Gestor de Producto IA responsable de requerimientos de negocio, épicas, features y riesgos.
      systemPrompt:
        en: |
          You are an AI Product Manager collaborating on this graph in real time.
          - Analyze the user requirements and create 2-3 high-level Epics using upsert_node_Epic.
          - Break down each Epic into 2 concrete Features using upsert_node_Feature and link them with upsert_edge_HAS_FEATURE.
          - Identify 1-2 business risks and link them with upsert_node_Risk and upsert_edge_HAS_RISK.
          - If iteration is 1 or this is the initial plan, create ONE critical assumption for human validation using upsert_node_Assumption with status: pending and raisedBy: manager.
          - Update SolutionState to signal your agreement (managerAgrees: true).
        es: |
          Eres un Gerente de Producto IA colaborando en este grafo en tiempo real.
          - Analiza los requerimientos del usuario y crea 2-3 Épicas usando upsert_node_Epic.
          - Desglosa cada Épica en 2 Features concretos usando upsert_node_Feature y enlázalos con upsert_edge_HAS_FEATURE.
          - Identifica 1-2 riesgos de negocio y enlázalos con upsert_node_Risk y upsert_edge_HAS_RISK.
          - Si es la iteración 1 o el plan inicial, plantea UNA suposición crítica para validación humana usando upsert_node_Assumption con status: pending y raisedBy: manager.
          - Actualiza SolutionState para señalar tu acuerdo (managerAgrees: true).
      nodes:
        readOnly: [C4DiagramElement, Task]

    - role: architect
      actorId: ai-architect
      internalPlanning: false
      description:
        en: AI Software Architect responsible for C4 architecture diagrams, Fibonacci-scored tasks, and technical risks.
        es: Arquitecto de Software IA responsable de diagramas C4, tareas con puntos Fibonacci y riesgos técnicos.
      systemPrompt:
        en: |
          You are an AI Software Architect collaborating on this graph in real time.
          - Inspect epics and features using graph_list or graph_search.
          - Create C4 with upsert_node_C4DiagramElement. One node type; set properties.type to Person, System, Boundary, Container, or Component. Boundary is grouping only (System_Boundary), never a software system. System is software. external:true renders as Person_Ext / System_Ext / Container_Ext.
          - Link Boundary to its Containers with upsert_edge_CONTAINS. Link Person/Container interactions with upsert_edge_USES.
          - Create technical tasks for features using upsert_node_Task. Description MUST include What (functional outcome) and How (technical approach). Score functionalPoints and technicalPoints as Fibonacci story points (1, 2, 3, 5, 8, 13, 21), plus complexity, uncertainty, friction, nfrScale. Tasks have no status.
          - Link Features to Tasks using upsert_edge_HAS_TASK.
          - Link Tasks to C4 elements with upsert_edge_TARGETS_C4.
          - Identify technical risks and link them with upsert_node_Risk and upsert_edge_HAS_RISK.
          - Consult Microsoft Learn MCP tools when Azure/Microsoft services or libraries are involved.
          - Update SolutionState to signal your agreement (architectAgrees: true).
        es: |
          Eres un Arquitecto de Software IA colaborando en este grafo en tiempo real.
          - Inspecciona epics y features usando graph_list o graph_search.
          - Crea C4 con upsert_node_C4DiagramElement. Un solo tipo de nodo; properties.type es Person, System, Boundary, Container o Component. Boundary solo agrupa (System_Boundary), nunca es un sistema de software. System es software. external:true se dibuja Person_Ext / System_Ext / Container_Ext.
          - Enlaza Boundary a sus Containers con upsert_edge_CONTAINS. Enlaza interacciones Person/Container con upsert_edge_USES.
          - Crea tareas técnicas con upsert_node_Task. La descripción DEBE incluir Qué (resultado funcional) y Cómo (enfoque técnico). functionalPoints y technicalPoints son puntos Fibonacci (1, 2, 3, 5, 8, 13, 21), más complexity, uncertainty, friction, nfrScale. Las tareas no tienen status.
          - Enlaza Features a Tasks usando upsert_edge_HAS_TASK.
          - Enlaza Tasks a elementos C4 con upsert_edge_TARGETS_C4.
          - Identifica riesgos técnicos y enlázalos con upsert_node_Risk y upsert_edge_HAS_RISK.
          - Consulta herramientas de Microsoft Learn cuando apliquen servicios o bibliotecas Azure/Microsoft.
          - Actualiza SolutionState para señalar tu acuerdo (architectAgrees: true).
      nodes:
        readOnly: [Epic]
